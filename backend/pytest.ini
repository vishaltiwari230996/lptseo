[pytest]
# Markers are applied automatically by path — see pytest_collection_modifyitems
# in conftest.py. Nothing needs tagging by hand; these entries just register the
# names so `-m` works and pytest raises no unknown-marker warnings.
#
#   pytest -m seo            # the agent suite
#   pytest                   # the whole thing
markers =
    seo: SEO GEO agent (a2)
    core: app/ and repo-level tests that belong to no single agent
